name: Publish Shorts

on:
  schedule:
    - cron: "17 * * * *" # hourly fallback; punctual runs come from the Cloudflare Worker (cloudflare/)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Publish what is due
        env:
          TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
        run: node publisher/publish.mjs due
      - name: Save results and renewed tokens
        if: always()
        run: |
          git config user.name "sidequest-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "Published Shorts update" && git push)
